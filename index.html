<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fade</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
:root {
  --bg-main: #050509;
  --bg-overlay: radial-gradient(circle at top, #1a0008 0%, #050509 45%, #000000 100%);
  --crimson: #c0183c;
  --crimson-soft: #7a0f26;
  --crimson-deep: #2b0009;
  --gold: #f5c46b;
  --gold-soft: #c89a4a;
  --text-main: #f5f5f7;
  --text-muted: #9b9ba3;
  --card-bg: rgba(10, 10, 16, 0.9);
  --card-border: rgba(192, 24, 60, 0.35);
  --card-shadow: 0 18px 40px rgba(0, 0, 0, 0.8);
  --accent-cyan: #3bd5ff;
  --accent-green: #43b581;

  --shadow-light: rgba(255, 255, 255, 0.06);

  --font-display: "Rajdhani", "Inter", sans-serif;
  --font-body: "Inter", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;

  --r-lg: 34px;
  --r-md: 24px;
  --r-sm: 16px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
}

html {
  overflow-x: hidden;
}

body {
  font-family: var(--font-body);
  background: var(--bg-main);
  color: var(--text-main);
  min-height: 100vh;
  overflow-x: hidden;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

.icon { flex-shrink: 0; }

.bg {
  position: fixed;
  inset: 0;
  z-index: -2;
}

#bg-canvas {
  width: 100%;
  height: 100%;
  display: block;
}

.bg-grain {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  opacity: 0.5;
}

.bg-overlay {
  position: absolute;
  inset: 0;
  background: var(--bg-overlay);
  mix-blend-mode: normal;
  pointer-events: none;
}

.scene-viewport {
  position: relative;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  perspective: 2100px;
  padding: 12px 64px;
  padding: 12px 64px max(12px, env(safe-area-inset-bottom));
}

.scene-stage {
  transform-style: preserve-3d;
  will-change: transform;
  cursor: grab;
  touch-action: pan-y;
  filter: drop-shadow(0 50px 70px rgba(0, 0, 0, 0.6));
}

.scene-stage:active {
  cursor: grabbing;
}

.scene-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  z-index: 5;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: none;
  background: var(--card-bg);
  color: var(--gold);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  box-shadow:
    6px 6px 14px rgba(0, 0, 0, 0.5),
    -5px -5px 14px var(--shadow-light),
    inset 0 0 0 1px var(--card-border);
  transition: box-shadow 0.25s ease, transform 0.2s ease, color 0.2s ease;
}

.scene-arrow:hover {
  color: var(--crimson-bright, #ff335f);
  transform: translateY(-50%) scale(1.06);
}

.scene-arrow:active {
  transform: translateY(-50%) scale(0.94);
  box-shadow:
    inset 4px 4px 10px rgba(0, 0, 0, 0.7),
    inset -3px -3px 8px var(--shadow-light);
}

.scene-arrow-left { left: 24px; }
.scene-arrow-right { right: 24px; }

@media (max-width: 900px) {
  .scene-viewport {
    perspective: 1500px;
    padding: 18px 14px;
    padding-top: max(18px, env(safe-area-inset-top));
    padding-bottom: max(18px, env(safe-area-inset-bottom));
  }
  .scene-arrow {
    width: 42px;
    height: 42px;
  }
  .scene-arrow-left { left: 6px; }
  .scene-arrow-right { right: 6px; }
}

@media (max-width: 480px) {
  .scene-viewport { padding: 14px 8px; }
  .scene-arrow {
    width: 38px;
    height: 38px;
  }
  .scene-arrow-left { left: 4px; }
  .scene-arrow-right { right: 4px; }
}

.layout {
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
  gap: 44px;
  padding: 56px 64px;
  width: min(1900px, 97vw);
}

@media (max-width: 1100px) {
  .layout {
    gap: 32px;
    padding: 44px 40px;
  }
}

@media (max-width: 900px) {
  .layout {
    grid-template-columns: 1fr;
    padding: 26px 16px;
    width: 100%;
    max-width: 720px;
    gap: 22px;
  }

  .hero-crimson {
    padding: 24px 20px;
    min-height: auto;
    overflow: visible;
  }

  .hero-main {
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 18px;
  }

  .avatar-orbit {
    width: 150px;
    height: 150px;
  }

  .royale-orbit .avatar-ring.inner {
    inset: 17px;
  }

  .avatar-core {
    inset: 30px;
  }

  .hero-orb {
    display: none;
  }

  .hero-name {
    font-size: clamp(34px, 11vw, 52px);
    white-space: nowrap;
  }

  .hero-text {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .hero-tagline {
    margin-left: auto;
    margin-right: auto;
  }

  .hero-actions {
    justify-content: center;
  }
}

@media (max-width: 480px) {
  .layout { padding: 18px 10px; gap: 18px; }
  .hero-crimson { padding: 20px 16px; }
  .hero-name { font-size: clamp(30px, 13vw, 44px); }
  .hero-handle { font-size: 15px; }
  .hero-tagline { font-size: 15px; }
  .avatar-orbit { width: 128px; height: 128px; }
  .royale-orbit .avatar-ring.inner { inset: 15px; }
  .avatar-core { inset: 26px; }
}

.hero {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.hero-crimson {
  position: relative;
  overflow: hidden;
  background: radial-gradient(circle at top left, #2b0009 0%, #050509 55%, #000000 100%);
  border-radius: var(--r-lg);
  padding: 40px 44px;
  border: 1px solid rgba(245, 196, 107, 0.18);
  box-shadow:
    0 22px 48px rgba(0, 0, 0, 0.6),
    -10px -10px 30px var(--shadow-light);
  min-height: 640px;
}

.hero-orb {
  position: absolute;
  width: 130px;
  height: 130px;
  right: 40px;
  bottom: 34px;
  z-index: 0;
  opacity: 0.85;
  filter: drop-shadow(0 14px 20px rgba(0, 0, 0, 0.8));
  animation: orb-breathe 5s ease-in-out infinite;
}

@keyframes orb-breathe {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

.vertical-panels {
  position: absolute;
  top: 0;
  right: 0;
  width: 42%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
  -webkit-mask-image: linear-gradient(to left, black 60%, transparent 100%);
  mask-image: linear-gradient(to left, black 60%, transparent 100%);
}

.vertical-panels span {
  position: absolute;
  top: 0;
  width: 3px;
  height: 100%;
  mix-blend-mode: screen;
  filter: blur(0.6px);
  background: linear-gradient(
    to bottom,
    transparent 0%,
    rgba(192, 24, 60, 0.55) 20%,
    rgba(245, 196, 107, 0.55) 50%,
    rgba(192, 24, 60, 0.55) 80%,
    transparent 100%
  );
  box-shadow: 0 0 12px rgba(192, 24, 60, 0.5), 0 0 20px rgba(245, 196, 107, 0.25);
  opacity: 0.35;
  animation: panel-pulse 7s ease-in-out infinite;
}

.vertical-panels span:nth-child(1) { left: 8%;  animation-delay: 0s; }
.vertical-panels span:nth-child(2) { left: 34%; animation-delay: 1.5s; }
.vertical-panels span:nth-child(3) { left: 62%; animation-delay: 3s; }
.vertical-panels span:nth-child(4) { left: 88%; animation-delay: 2.2s; }

@keyframes panel-pulse {
  0%, 100% { opacity: 0.15; transform: scaleY(0.97); }
  50% { opacity: 0.55; transform: scaleY(1); }
}

.hero-top,
.hero-main,
.hero-footer {
  position: relative;
  z-index: 1;
}

.hero-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  gap: 12px;
}

.brand-mark {
  letter-spacing: 0.18em;
  font-size: 11px;
  text-transform: uppercase;
  color: var(--gold-soft);
  display: inline-flex;
  align-items: center;
  gap: 7px;
}

.btn-ghost {
  border-radius: 999px;
  border: 1px solid rgba(245, 196, 107, 0.4);
  padding: 8px 16px;
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  background: var(--card-bg);
  color: var(--gold);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  -webkit-tap-highlight-color: transparent;
  box-shadow:
    5px 5px 12px rgba(0, 0, 0, 0.6),
    -4px -4px 10px var(--shadow-light);
  transition: background 0.2s, transform 0.15s ease, box-shadow 0.2s;
}

.btn-ghost:hover {
  background: rgba(245, 196, 107, 0.08);
  box-shadow: 0 0 18px rgba(245, 196, 107, 0.35);
  transform: translateY(-1px);
}

.btn-ghost:active {
  box-shadow:
    inset 3px 3px 8px rgba(0, 0, 0, 0.6),
    inset -2px -2px 6px var(--shadow-light);
  transform: translateY(0);
}

.hero-main {
  display: flex;
  gap: 24px;
  align-items: center;
}

.avatar-orbit {
  position: relative;
  width: 220px;
  height: 220px;
  flex-shrink: 0;
}

.avatar-svg-ring {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  animation: orbit-spin 40s linear infinite;
}

.royale-orbit .avatar-ring.outer {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 2px solid rgba(192, 24, 60, 0.5);
  box-shadow: 0 0 22px rgba(192, 24, 60, 0.45);
  animation: orbit-spin 22s linear infinite;
}

.royale-orbit .avatar-ring.inner {
  position: absolute;
  inset: 25px;
  border-radius: 50%;
  border: 2px solid rgba(245, 196, 107, 0.5);
  box-shadow: 0 0 18px rgba(245, 196, 107, 0.4);
  animation: orbit-spin-reverse 26s linear infinite;
}

.avatar-core {
  position: absolute;
  inset: 44px;
  border-radius: 50%;
  overflow: hidden;
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.9), 0 0 0 3px rgba(0,0,0,0.4);
  animation: avatar-breathe 4s ease-in-out infinite;
}

.avatar-core img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

@keyframes orbit-spin {
  to { transform: rotate(360deg); }
}

@keyframes orbit-spin-reverse {
  to { transform: rotate(-360deg); }
}

@keyframes avatar-breathe {
  0%, 100% { box-shadow: 0 12px 28px rgba(0, 0, 0, 0.9), 0 0 0 3px rgba(0,0,0,0.4); }
  50% { box-shadow: 0 12px 34px rgba(192, 24, 60, 0.6), 0 0 0 3px rgba(0,0,0,0.4); }
}

.hero-text {
  flex: 1;
  min-width: 0;
}

.hero-name {
  font-size: clamp(38px, 5.2vw, 58px);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  line-height: 1;
}

.hero-name-royale {
  background: linear-gradient(90deg, #ff335f, #f5c46b);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.hero-handle {
  font-size: clamp(16px, 1.6vw, 19px);
  color: var(--text-muted);
  margin-top: 6px;
}

.hero-tagline {
  margin-top: 22px;
  font-size: clamp(15px, 1.4vw, 17px);
  color: var(--text-main);
  max-width: 480px;
}

.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  margin-top: 28px;
}

.btn-solid {
  border-radius: 999px;
  padding: 14px 26px;
  font-size: 14px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  border: none;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.15s ease, filter 0.2s ease;
}

.btn-royale {
  background: linear-gradient(135deg, #c0183c, #f5c46b);
  color: #050509;
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.9);
}

.btn-royale:hover {
  filter: brightness(1.08);
  transform: translateY(-2px);
}

.btn-royale:active {
  transform: translateY(0);
  filter: brightness(0.96);
}

.btn-outline {
  border-radius: 999px;
  padding: 9px 18px;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  border: 1px solid rgba(245, 196, 107, 0.5);
  background: transparent;
  color: var(--gold);
  text-decoration: none;
  transition: transform 0.15s ease, background 0.2s ease;
}

.btn-royale-outline:hover {
  background: rgba(245, 196, 107, 0.08);
  transform: translateY(-2px);
}

.hero-footer {
  margin-top: 24px;
  font-size: 11px;
  color: var(--text-muted);
}

.hero-footer-royale {
  border-top: 1px solid rgba(245, 196, 107, 0.18);
  padding-top: 12px;
}

.sidebar {
  display: flex;
}

.sidebar-royale .sidebar-shell {
  display: flex;
  flex-direction: column;
  gap: 22px;
  width: 100%;
}

.card {
  position: relative;
  background: var(--card-bg);
  border-radius: var(--r-md);
  border: 1px solid var(--card-border);
  box-shadow:
    0 16px 36px rgba(0, 0, 0, 0.55),
    -8px -8px 22px var(--shadow-light);
  padding: 22px 24px;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  animation: card-glow 6s ease-in-out infinite;
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.card:hover {
  transform: translateY(-3px);
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.55), 0 0 20px rgba(192, 24, 60, 0.18), -8px -8px 22px var(--shadow-light);
}

.card-discord { animation-delay: 0s; }
.card-spotify { animation-delay: 1.2s; }
.card-game    { animation-delay: 2.4s; }
.card-log     { animation-delay: 3.6s; }

@keyframes card-glow {
  0%, 100% { border-color: var(--card-border); }
  50% { border-color: rgba(245, 196, 107, 0.35); }
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
  gap: 8px;
}

.card-label {
  font-size: 13px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text-muted);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.card-label .icon {
  color: var(--gold-soft);
}

.card-discord {
  min-height: 250px;
  display: flex;
  flex-direction: column;
}

.card-discord .card-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 4px;
}

.status-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  box-shadow: 0 0 12px rgba(67, 181, 129, 0.7);
  animation: dot-pulse 2.4s ease-in-out infinite;
}

@keyframes dot-pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.2); opacity: 0.75; }
}

.discord-name {
  font-size: clamp(18px, 1.8vw, 22px);
  font-weight: 600;
  word-break: break-word;
}

.discord-status {
  font-size: 15px;
  color: var(--text-muted);
}

.discord-custom {
  font-size: 15px;
  margin-top: 8px;
  color: var(--text-main);
}

.card-vertical {
  min-height: 150px;
  display: flex;
  flex-direction: column;
}

.card-vertical .card-body {
  flex: 1;
  display: flex;
  flex-direction: row;
  align-items: center;
  text-align: left;
  gap: 18px;
  min-width: 0;
}

.spotify-cover-wrap {
  position: relative;
  width: 112px;
  height: 112px;
  flex-shrink: 0;
  border-radius: 18px;
  overflow: hidden;
}

.royale-cover {
  border: 1px solid rgba(192, 24, 60, 0.6);
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.9);
  animation: cover-breathe 4.5s ease-in-out infinite;
}

@keyframes cover-breathe {
  0%, 100% { box-shadow: 0 12px 28px rgba(0, 0, 0, 0.9); }
  50% { box-shadow: 0 12px 32px rgba(192, 24, 60, 0.55); }
}

.spotify-cover-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.spotify-glow {
  position: absolute;
  inset: 0;
  mix-blend-mode: screen;
}

.royale-glow {
  background: radial-gradient(circle at center, rgba(192, 24, 60, 0.6), transparent 60%);
  animation: glow-pulse 4s ease-in-out infinite;
}

@keyframes glow-pulse {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}

.spotify-meta {
  flex: 1;
  min-width: 0;
}

.spotify-title-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.spotify-title {
  font-size: 17px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.eq-bars {
  flex-shrink: 0;
  animation: eq-bounce 1.1s ease-in-out infinite;
  transform-origin: bottom;
}

.eq-bars rect:nth-child(1) { animation: eq-bar 0.9s ease-in-out infinite; transform-origin: bottom; }
.eq-bars rect:nth-child(2) { animation: eq-bar 0.9s ease-in-out infinite 0.2s; transform-origin: bottom; }
.eq-bars rect:nth-child(3) { animation: eq-bar 0.9s ease-in-out infinite 0.4s; transform-origin: bottom; }

@keyframes eq-bar {
  0%, 100% { transform: scaleY(0.5); }
  50% { transform: scaleY(1); }
}

.spotify-artist {
  font-size: 15px;
  color: var(--text-muted);
  margin-top: 3px;
}

.spotify-progress {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 14px;
  font-size: 12px;
}

.spotify-bar {
  flex: 1;
  height: 5px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.08);
  overflow: hidden;
}

#spotify-bar-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, #c0183c, #f5c46b);
  transition: width 0.9s linear;
}

.game-cover-wrap {
  width: 112px;
  height: 112px;
  flex-shrink: 0;
  border-radius: 18px;
  overflow: hidden;
  border: 1px solid rgba(192, 24, 60, 0.6);
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.9);
  animation: cover-breathe 4.5s ease-in-out infinite;
  animation-delay: 2s;
}

.game-cover-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.game-meta {
  flex: 1;
  min-width: 0;
}

.game-header {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 6px;
}

.game-icon {
  width: 20px;
  height: 20px;
}

.game-title {
  font-size: 17px;
  font-weight: 600;
}

.game-details {
  font-size: 15px;
  color: var(--text-muted);
  margin-top: 3px;
}

.game-time {
  font-size: 13px;
  color: var(--gold-soft);
  margin-top: 8px;
}

.platform-pill {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid rgba(245, 196, 107, 0.5);
  color: var(--gold);
}

.log-body {
  max-height: 150px;
  overflow: hidden;
}

.log-output {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 13px;
  color: var(--text-muted);
}

.log-line {
  white-space: nowrap;
  animation: log-in 0.3s ease;
}

@keyframes log-in {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===============================
   RESPONSIVE — CARDS & SIDEBAR
   Keep the 3D card depth, shrink
   paddings/covers for small screens.
   =============================== */
@media (max-width: 900px) {
  .sidebar-royale .sidebar-shell { gap: 16px; }

  .card { padding: 18px 18px; }

  .card-discord { min-height: 150px; }
  .card-vertical { min-height: 0; }

  .spotify-cover-wrap,
  .game-cover-wrap {
    width: 88px;
    height: 88px;
    border-radius: 14px;
  }

  <script src="script-v5.js"></script>

  <script>
    (function () {
      var stage = document.getElementById('scene-stage');
      var viewport = document.getElementById('scene-viewport');
      var arrowLeft = document.getElementById('arrow-left');
      var arrowRight = document.getElementById('arrow-right');

      var rotY = 0;
      var zoomed = false;
      var holding = false;
      var dragging = false;
      var pointerDownAt = 0;
      var pointerMoved = false;
      var startX = 0, startY = 0;
      var lastX = 0;
      var HOLD_THRESHOLD = 280;
      var MOVE_TOLERANCE = 12;
      var holdTimer = null;

      // Responsive 3D profile — keep the 3D-2D look but keep text readable on small screens.
      function profile() {
        var w = window.innerWidth;
        if (w <= 480) {
          return { tilt: 10, tiltZoom: 6, scale: 1, scaleZoom: 1.03 };
        }
        if (w <= 900) {
          return { tilt: 16, tiltZoom: 10, scale: 1, scaleZoom: 1.04 };
        }
        return { tilt: 40, tiltZoom: 22, scale: 0.94, scaleZoom: 1.06 };
      }

      function render(instant) {
        var p = profile();
        var tilt = (zoomed || holding) ? p.tiltZoom : p.tilt;
        var scale = (zoomed || holding) ? p.scaleZoom : p.scale;
        var duration = (instant || dragging) ? 0 : (holding ? 0.5 : 0.85);
        stage.style.transition = 'transform ' + duration + 's cubic-bezier(.32,.9,.24,1)';
        stage.style.transform =
          'rotateX(' + tilt + 'deg) rotateY(' + rotY + 'deg) scale(' + scale + ')';
      }

      render(true);

      // Keep tilt in sync when the viewport size changes (e.g. device rotation).
      window.addEventListener('resize', function () { render(); });

      function isInteractive(el) {
        return !!el.closest('a, button, input, textarea, select, .scene-arrow');
      }

      viewport.addEventListener('pointerdown', function (e) {
        if (isInteractive(e.target)) return;
        pointerDownAt = Date.now();
        pointerMoved = false;
        dragging = false;
        startX = e.clientX;
        startY = e.clientY;
        lastX = e.clientX;

        holdTimer = setTimeout(function () {
          if (!pointerMoved) {
            holding = true;
            render();
          }
        }, HOLD_THRESHOLD);
      });

      viewport.addEventListener('pointermove', function (e) {
        if (Math.abs(e.clientX - startX) > MOVE_TOLERANCE || Math.abs(e.clientY - startY) > MOVE_TOLERANCE) {
          pointerMoved = true;
        }

        // Horizontal drag rotates the stage in 3D — natural on touch + mouse.
        if (pointerMoved && !holding) {
          if (!dragging) {
            dragging = true;
            clearTimeout(holdTimer);
          }
          var dx = e.clientX - lastX;
          rotY += dx * 0.35;
          lastX = e.clientX;
          render(true);
        }
      });

      function endPress(e) {
        clearTimeout(holdTimer);
        if (isInteractive(e.target) && !holding && !dragging) return;

        var wasHolding = holding;
        holding = false;

        if (wasHolding) {
          zoomed = false;
        } else if (!pointerMoved && !dragging && Date.now() - pointerDownAt < HOLD_THRESHOLD + 40) {
          zoomed = !zoomed;
        }
        dragging = false;
        render();
      }

      viewport.addEventListener('pointerup', endPress);
      viewport.addEventListener('pointercancel', function () {
        clearTimeout(holdTimer);
        holding = false;
        zoomed = false;
        dragging = false;
        render();
      });
      viewport.addEventListener('pointerleave', function (e) {
        if (holding || dragging) {
          clearTimeout(holdTimer);
          holding = false;
          dragging = false;
          zoomed = false;
          render();
        }
      });

      function startRotate(dir) {
        rotY += dir * 14;
        render();
        var repeat = setInterval(function () {
          rotY += dir * 4;
          render();
        }, 130);
        function stop() {
          clearInterval(repeat);
          window.removeEventListener('pointerup', stop);
          window.removeEventListener('pointercancel', stop);
        }
        window.addEventListener('pointerup', stop);
        window.addEventListener('pointercancel', stop);
      }

      arrowLeft.addEventListener('pointerdown', function (e) {
        e.stopPropagation();
        startRotate(-1);
      });
      arrowRight.addEventListener('pointerdown', function (e) {
        e.stopPropagation();
        startRotate(1);
      });
    })();
  </script>
